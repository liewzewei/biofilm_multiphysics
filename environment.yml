# Reproducible environment for the biofilm structural FEM model.
#   conda env create -f environment.yml
#   conda activate biofilm-fem
# Versions are the ones the final notebook and tests were verified with.
name: biofilm-fem
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  # numerical core
  - numpy=2.5.3
  - scipy=1.18.1
  - sfepy=2026.3
  - meshio=5.3.5
  - shapely=2.2.0
  - pandas=3.0.6
  - matplotlib=3.11.2
  # notebooks
  - jupyterlab=4.6.4
  - ipykernel=7.4.0
  - nbformat=5.11.1
  - nbclient=0.11.0
  - nbconvert=7.17.1
  # tests
  - pytest=9.1.1
